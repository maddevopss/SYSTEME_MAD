name: Markdown links

on:
  pull_request:
    branches: [main]
    paths: ["**/*.md", "08-BOOTSTRAPS/audit-markdown-links.py", "08-BOOTSTRAPS/audit-markdown-anchors.py", ".github/workflows/markdown-links.yml"]
  push:
    branches: [main]
    paths: ["**/*.md", "08-BOOTSTRAPS/audit-markdown-links.py", "08-BOOTSTRAPS/audit-markdown-anchors.py", ".github/workflows/markdown-links.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Valider les fichiers liés
        run: python 08-BOOTSTRAPS/audit-markdown-links.py
      - name: Valider les ancres liées
        run: python 08-BOOTSTRAPS/audit-markdown-anchors.py
