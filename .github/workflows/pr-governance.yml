name: PR governance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: PR governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test MADSuite synchronization guard
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v

      - name: Test MADSuite synchronization generator
        run: python .github/scripts/test_generate_madsuite_sync_entry.py -v

      - name: Validate MADSuite corrective links
        run: python .github/scripts/guard-madsuite-corrections.py

      - name: Validate MADSuite synchronization transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:00-SYSTEME-MAD/governance/madsuite-sync-registry.json" \
            > /tmp/madsuite-sync-registry.base.json
          python .github/scripts/guard-madsuite-sync-transition.py \
            /tmp/madsuite-sync-registry.base.json \
            00-SYSTEME-MAD/governance/madsuite-sync-registry.json

      - name: Validate MADSuite synchronization registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/guard-madsuite-sync.py --remote

      - name: Inspect pull request governance
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          head_ref = os.environ.get("HEAD_REF", "")
          pr_author = os.environ.get("PR_AUTHOR", "")
          pr_body = os.environ.get("PR_BODY", "")
          is_draft = os.environ.get("PR_DRAFT", "false").lower() == "true"

          result = subprocess.run(
              ["git", "diff", "--name-only", "-z", f"{base}...{head}"],
              check=True,
              capture_output=True,
              text=True,
          )
          changed = [Path(path) for path in result.stdout.split("\0") if path]
          errors = []

          if not is_draft:
              required_sections = [
                  "## Intention",
                  "## Changements principaux",
                  "## Vérifications effectuées",
                  "## Risques et points à surveiller",
              ]
              for section in required_sections:
                  if section not in pr_body:
                      errors.append(f"Section manquante dans la PR prête à réviser : {section}")

          generated = Path("00-SYSTEME-MAD/governance/generated-dashboard.md")
          is_dashboard_automation = (
              head_ref == "automation/governance-dashboard"
              and pr_author == "github-actions[bot]"
          )
          if generated in changed and not is_dashboard_automation:
              errors.append(
                  "Le dashboard généré ne doit être modifié que par "
                  "l’automatisation GitHub autorisée."
              )

          conflict_pattern = re.compile(r"^(<<<<<<<|=======|>>>>>>>)", re.MULTILINE)
          secret_patterns = [
              re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"gh[pousr]_[A-Za-z0-9_]{30,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{30,}"),
          ]

          text_suffixes = {
              ".md", ".txt", ".yml", ".yaml", ".json", ".js", ".mjs",
              ".cjs", ".ts", ".tsx", ".py", ".sh", ".ps1", ".toml",
              ".pem", ".key", ".p8",
          }

          for path in changed:
              is_environment_file = path.name == ".env" or path.name.startswith(".env.")
              is_text = (
                  path.suffix.lower() in text_suffixes
                  or path.name == ".envrc"
                  or is_environment_file
              )
              if not path.exists() or not is_text:
                  continue

              content = path.read_text(encoding="utf-8", errors="replace")
              if conflict_pattern.search(content):
                  errors.append(f"Marqueur de conflit Git détecté : {path}")

              for pattern in secret_patterns:
                  if pattern.search(content):
                      errors.append(f"Secret potentiel détecté : {path}")
                      break

              if str(path).startswith(".github/workflows/") and "permissions:" not in content:
                  errors.append(f"Workflow sans permissions explicites : {path}")

          if errors:
              print("PR governance failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print(f"PR governance passed for {len(changed)} changed file(s).")
          PY
