name: Docs quality smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-quality-smoke:
    name: Docs quality smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate critical documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required_files = [
              Path("README.md"),
              Path("MANIFEST.md"),
              Path("00-SYSTEME-MAD/ai-context.md"),
              Path("00-SYSTEME-MAD/decisions.md"),
              Path("09-CHECKLISTS/chk-047-madproof-readiness-master.md"),
              Path("09-CHECKLISTS/chk-048-evidence-log-madproof.md"),
          ]

          yaml_required = [
              Path("MANIFEST.md"),
              Path("00-SYSTEME-MAD/ai-context.md"),
              Path("00-SYSTEME-MAD/decisions.md"),
              Path("09-CHECKLISTS/chk-047-madproof-readiness-master.md"),
              Path("09-CHECKLISTS/chk-048-evidence-log-madproof.md"),
          ]

          required_yaml_fields = [
              "Projet:",
              "Document:",
              "Version:",
              "Dernière révision:",
              "Statut:",
              "Auteur:",
          ]

          errors = []

          for path in required_files:
              if not path.exists():
                  errors.append(f"Missing required file: {path}")

          for path in yaml_required:
              if not path.exists():
                  continue

              content = path.read_text(encoding="utf-8")
              if not content.startswith("---\n"):
                  errors.append(f"Missing YAML front matter start: {path}")
                  continue

              parts = content.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"Invalid YAML front matter block: {path}")
                  continue

              yaml_block = parts[1]
              for field in required_yaml_fields:
                  if field not in yaml_block:
                      errors.append(f"Missing YAML field {field} in {path}")

          if errors:
              print("Docs quality smoke failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Docs quality smoke passed.")
          PY

      - name: Prevent legacy MADSuite path regressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))

          if event_name == "pull_request":
              base = event["pull_request"]["base"]["sha"]
              head = event["pull_request"]["head"]["sha"]
          elif event_name == "push":
              base = event.get("before")
              head = event.get("after")
          else:
              head = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()
              base = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"], text=True
              ).strip()

          if not base or set(base) == {"0"}:
              base = subprocess.check_output(
                  ["git", "rev-list", "--max-parents=0", head], text=True
              ).splitlines()[0]

          diff = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--unified=0",
                  base,
                  head,
                  "--",
                  "*.md",
                  "*.yml",
                  "*.yaml",
              ],
              text=True,
          )

          forbidden = "01-PRODUIT/" + "madsuite/"
          allowed_files = {
              "00-SYSTEME-MAD/governance/audit-final-migration-madsuite-2026-07-18.md",
          }

          current_file = None
          violations = []

          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  current_file = line[6:]
                  continue

              if (
                  current_file
                  and current_file not in allowed_files
                  and line.startswith("+")
                  and not line.startswith("+++")
                  and forbidden in line
              ):
                  violations.append((current_file, line[1:]))

          if violations:
              print("Legacy MADSuite path regression detected:")
              for path, content in violations:
                  print(f"- {path}: {content}")
              print("Use SYSTEME_MAD/02-GUIDE/madsuite/ instead.")
              sys.exit(1)

          print("No new legacy MADSuite path reference detected.")
          PY

      - name: Audit local Markdown links
        shell: bash
        run: python 08-BOOTSTRAPS/audit-markdown-links.py
