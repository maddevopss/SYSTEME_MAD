name: Registry integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: MAD Registry integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated registry artifacts
        run: node 08-BOOTSTRAPS/generate-mad-registry.mjs --check

      - name: Check registry traceability
        run: node 08-BOOTSTRAPS/generate-mad-traceability.mjs --check

      - name: Check registry provenance chains
        run: node 08-BOOTSTRAPS/generate-mad-provenance.mjs --check

      - name: Check registry live dashboard and P4.2 metrics
        run: node 08-BOOTSTRAPS/generate-mad-registry-dashboard.mjs --check

      - name: Check registry architecture P4.3
        run: node 08-BOOTSTRAPS/generate-mad-registry-architecture.mjs --check

      - name: Check registry radar P4.4
        run: node 08-BOOTSTRAPS/generate-mad-registry-radar.mjs --check

      - name: Check registry MAD Health P4.5
        run: node 08-BOOTSTRAPS/generate-mad-registry-health.mjs --check

      - name: Check registry MAD Health trends P4.6
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-trends.mjs --check

      - name: Check registry MAD Health alerts P4.7
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-alerts.mjs --check

      - name: Check registry MAD Health actions P4.8
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-actions.mjs --check

      - name: Check registry MAD Health decisions P4.9
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-decisions.mjs --check

      - name: Check registry MAD Health decision ledger P4.10
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-decision-ledger.mjs --check

      - name: Check registry MAD Health execution tracking P4.11
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-execution.mjs --check

      - name: Check registry MAD Health impact verification P4.12
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-impact.mjs --check

      - name: Check registry MAD Health learning loop P4.13
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-learning.mjs --check

      - name: Check registry MAD Health controlled promotion P4.14
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-promotion.mjs --check

      - name: Check registry MAD Health institutional integration P4.15
        run: node 08-BOOTSTRAPS/generate-mad-registry-health-integration.mjs --check

      - name: Check institutional manifest P5.1
        run: node 08-BOOTSTRAPS/generate-mad-institutional-manifest.mjs --check

      - name: Audit registry
        run: node 08-BOOTSTRAPS/audit-mad-registry.mjs

      - name: Publish reports in job summary
        if: always()
        shell: bash
        run: |
          reports=(
            00-SYSTEME-MAD/registry/generated-registry-dashboard.md
            00-SYSTEME-MAD/registry/generated-registry-health.md
            00-SYSTEME-MAD/registry/generated-registry-health-trends.md
            00-SYSTEME-MAD/registry/generated-registry-health-alerts.md
            00-SYSTEME-MAD/registry/generated-registry-health-actions.md
            00-SYSTEME-MAD/registry/generated-registry-health-decisions.md
            00-SYSTEME-MAD/registry/generated-registry-health-decision-ledger.md
            00-SYSTEME-MAD/registry/generated-registry-health-execution.md
            00-SYSTEME-MAD/registry/generated-registry-health-impact.md
            00-SYSTEME-MAD/registry/generated-registry-health-learning.md
            00-SYSTEME-MAD/registry/generated-registry-health-promotion.md
            00-SYSTEME-MAD/registry/generated-registry-health-integration.md
            00-SYSTEME-MAD/governance/generated-institutional-manifest.md
            00-SYSTEME-MAD/registry/generated-registry-radar.md
            00-SYSTEME-MAD/registry/generated-registry-architecture.md
            00-SYSTEME-MAD/registry/generated-integrity-report.md
            00-SYSTEME-MAD/registry/generated-relations-graph.md
            00-SYSTEME-MAD/registry/generated-traceability.md
            00-SYSTEME-MAD/registry/generated-provenance-chains.md
          )

          first=true
          for report in "${reports[@]}"; do
            if [[ ! -f "$report" ]]; then
              printf '\n> Rapport indisponible : `%s`\n' "$report" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [[ "$first" == false ]]; then
              printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            first=false
          done

      - name: Upload registry reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad-registry-reports
          path: |
            00-SYSTEME-MAD/registry/generated-registry-dashboard.md
            00-SYSTEME-MAD/registry/generated-registry-metrics.json
            00-SYSTEME-MAD/registry/generated-registry-health.md
            00-SYSTEME-MAD/registry/generated-registry-health.json
            00-SYSTEME-MAD/registry/registry-health-history.json
            00-SYSTEME-MAD/registry/generated-registry-health-trends.md
            00-SYSTEME-MAD/registry/generated-registry-health-trends.json
            00-SYSTEME-MAD/registry/generated-registry-health-alerts.md
            00-SYSTEME-MAD/registry/generated-registry-health-alerts.json
            00-SYSTEME-MAD/registry/generated-registry-health-actions.md
            00-SYSTEME-MAD/registry/generated-registry-health-actions.json
            00-SYSTEME-MAD/registry/generated-registry-health-decisions.md
            00-SYSTEME-MAD/registry/generated-registry-health-decisions.json
            00-SYSTEME-MAD/registry/registry-health-decision-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-decision-ledger.md
            00-SYSTEME-MAD/registry/generated-registry-health-decision-ledger.json
            00-SYSTEME-MAD/registry/registry-health-execution-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-execution.md
            00-SYSTEME-MAD/registry/generated-registry-health-execution.json
            00-SYSTEME-MAD/registry/registry-health-impact-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-impact.md
            00-SYSTEME-MAD/registry/generated-registry-health-impact.json
            00-SYSTEME-MAD/registry/registry-health-learning-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-learning.md
            00-SYSTEME-MAD/registry/generated-registry-health-learning.json
            00-SYSTEME-MAD/registry/registry-health-promotion-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-promotion.md
            00-SYSTEME-MAD/registry/generated-registry-health-promotion.json
            00-SYSTEME-MAD/registry/registry-health-integration-ledger.json
            00-SYSTEME-MAD/registry/generated-registry-health-integration.md
            00-SYSTEME-MAD/registry/generated-registry-health-integration.json
            00-SYSTEME-MAD/governance/institutional-release.json
            00-SYSTEME-MAD/governance/generated-institutional-manifest.md
            00-SYSTEME-MAD/governance/generated-institutional-manifest.json
            00-SYSTEME-MAD/registry/generated-registry-radar.md
            00-SYSTEME-MAD/registry/generated-registry-radar.json
            00-SYSTEME-MAD/registry/generated-registry-architecture.md
            00-SYSTEME-MAD/registry/generated-integrity-report.md
            00-SYSTEME-MAD/registry/generated-relations-graph.md
            00-SYSTEME-MAD/registry/generated-traceability.md
            00-SYSTEME-MAD/registry/generated-provenance-chains.md
          if-no-files-found: warn
