name: Registry integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "00-SYSTEME-MAD/**"
      - "01-FONDATIONS/**"
      - "02-GUIDE/**"
      - "03-STANDARDS/**"
      - "04-ADR/**"
      - "05-PLAY/**"
      - "06-KNOWLEDGE-BASE/**"
      - "07-TEMPLATES/**"
      - "08-BOOTSTRAPS/**"
      - "09-CHECKLISTS/**"
      - "10-ROADMAP/**"
      - "11-ACADEMY/**"
      - "12-INNOVATION/**"
      - "13-RESSOURCES/**"
      - ".github/workflows/registry-integrity.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: MAD Registry integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated registry artifacts
        run: node 08-BOOTSTRAPS/generate-mad-registry.mjs --check

      - name: Check registry traceability
        run: node 08-BOOTSTRAPS/generate-mad-traceability.mjs --check

      - name: Audit registry
        run: node 08-BOOTSTRAPS/audit-mad-registry.mjs

      - name: Publish reports in job summary
        if: always()
        run: |
          cat 00-SYSTEME-MAD/registry/generated-integrity-report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          cat 00-SYSTEME-MAD/registry/generated-relations-graph.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          cat 00-SYSTEME-MAD/registry/generated-traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registry reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad-registry-reports
          path: |
            00-SYSTEME-MAD/registry/generated-integrity-report.md
            00-SYSTEME-MAD/registry/generated-relations-graph.md
            00-SYSTEME-MAD/registry/generated-traceability.md
          if-no-files-found: error
