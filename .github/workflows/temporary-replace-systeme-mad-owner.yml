name: Remplacement temporaire des références SYSTEME_MAD

on:
  push:
    branches:
      - docs/remplacer-references-systeme-mad-owner
    paths:
      - .github/workflows/temporary-replace-systeme-mad-owner.yml

permissions:
  contents: write

jobs:
  replace-references:
    runs-on: ubuntu-latest
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@v4
        with:
          ref: docs/remplacer-references-systeme-mad-owner
          fetch-depth: 0

      - name: Remplacer toutes les références historiques
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = b"bleeband/SYSTEME_MAD"
          new = b"maddevopss/SYSTEME_MAD"
          excluded = {Path('.git')}
          changed = []
          replacements = 0

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              data = path.read_bytes()
              count = data.count(old)
              if count:
                  path.write_bytes(data.replace(old, new))
                  changed.append(str(path))
                  replacements += count

          print(f"Fichiers modifiés: {len(changed)}")
          print(f"Occurrences remplacées: {replacements}")
          for path in changed:
              print(path)

          if replacements == 0:
              raise SystemExit("Aucune occurrence à remplacer")
          PY

      - name: Supprimer ce workflow temporaire
        run: rm .github/workflows/temporary-replace-systeme-mad-owner.yml

      - name: Vérifier l'absence de références historiques
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -F 'bleeband/SYSTEME_MAD' -- . ':!.git' ; then
            echo 'Des références historiques subsistent.' >&2
            exit 1
          fi

      - name: Publier le remplacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(governance): remplacer les références du dépôt SYSTEME_MAD'
          git push origin HEAD:docs/remplacer-references-systeme-mad-owner
