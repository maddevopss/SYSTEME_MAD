name: Normalisation YAML résiduelle

on:
  push:
    branches: [ci/reactiver-validation-yaml-globale]
    paths: [".github/workflows/normalize-yaml-residuals.yml"]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/reactiver-validation-yaml-globale
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normaliser les en-têtes résiduels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          TODAY = "2026-07-20"
          FILES = {
              "00-SYSTEME-MAD/registry/registry-generation-p1.md": {},
              "00-SYSTEME-MAD/registry/registry-provenance-p3-2.md": {},
              "02-GUIDE/madsuite/guide-implementation-manuelle-lot-1-mad-ariane.md": {},
              "02-GUIDE/synthese-chaine-commerciale-mad-devops.md": {},
              "03-STANDARDS/std-800-mad-guardian-quality-gates.md": {},
              "04-ADR/ADR-007-mad-guardian-certification-continue.md": {},
              "05-PLAY/play-022-audit-chaine-commerciale-mad-devops.md": {},
              "06-KNOWLEDGE-BASE/mad-guardian-glossaire.md": {},
              "06-KNOWLEDGE-BASE/modele-preuve-certification.md": {
                  "Projet": "Système MAD",
                  "Document": "Modèle de preuve de certification",
                  "Version": "1.0",
                  "Statut": "À valider",
                  "Auteur": "MAD DevOps",
              },
              "09-CHECKLISTS/chk-014-audit-chaine-commerciale-mad-devops.md": {},
              "10-ROADMAP/mad-guardian-roadmap.md": {},
              "10-ROADMAP/madproof-certification-snapshot-20260707.md": {
                  "Projet": "Système MAD",
                  "Document": "Snapshot de certification MADPROOF — 2026-07-07",
                  "Version": "1.0",
                  "Statut": "Historique",
                  "Auteur": "MAD DevOps",
              },
              "10-ROADMAP/madproof-final-local-audit-20260707-CORRECTED.md": {},
              "10-ROADMAP/madproof-final-local-audit-20260707.md": {},
              "12-INNOVATION/gouvernance/fiche-poste-gardien-referentiel-mad.md": {
                  "Projet": "Système MAD",
                  "Document": "Fiche de poste — Gardien du référentiel MAD",
                  "Version": "0.1",
                  "Statut": "Brouillon",
                  "Auteur": "MAD DevOps",
              },
          }

          def normalize(path: Path, defaults: dict[str, str]) -> None:
              text = path.read_text(encoding="utf-8")
              body = text
              metadata: list[tuple[str, str]] = []

              if text.startswith("---\n"):
                  parts = text.split("---", 2)
                  if len(parts) >= 3:
                      header = parts[1].strip("\n")
                      body = parts[2].lstrip("\n")
                      for line in header.splitlines():
                          if ":" in line:
                              key, value = line.split(":", 1)
                              metadata.append((key.strip(), value.strip()))

              values = {key: value for key, value in metadata}
              project = values.get("Projet") or defaults.get("Projet") or "Système MAD"
              document = values.get("Document") or defaults.get("Document") or path.stem.replace("-", " ")
              version = values.get("Version") or defaults.get("Version") or "1.0"
              revision = values.get("Dernière révision") or values.get("Derniere revision") or values.get("updated_at") or TODAY
              status = values.get("Statut") or defaults.get("Statut") or "À valider"
              author = values.get("Auteur") or values.get("Owner") or defaults.get("Auteur") or "MAD DevOps"

              canonical = [
                  ("Projet", project),
                  ("Document", document),
                  ("Version", version),
                  ("Dernière révision", revision),
                  ("Statut", status),
                  ("Auteur", author),
              ]
              canonical_keys = {key for key, _ in canonical}
              aliases = {"Derniere revision"}
              extras = [(key, value) for key, value in metadata if key not in canonical_keys and key not in aliases]
              header_lines = [f"{key}: {value}" for key, value in canonical + extras]
              path.write_text("---\n" + "\n".join(header_lines) + "\n---\n\n" + body, encoding="utf-8")

          for filename, defaults in FILES.items():
              normalize(Path(filename), defaults)
          PY

          git rm .github/workflows/normalize-yaml-residuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00-SYSTEME-MAD 02-GUIDE 03-STANDARDS 04-ADR 05-PLAY 06-KNOWLEDGE-BASE 09-CHECKLISTS 10-ROADMAP 12-INNOVATION
          git commit -m "docs(yaml): normaliser les écarts résiduels du balayage global"
          git push origin HEAD:ci/reactiver-validation-yaml-globale
