name: Governance dashboard

# Le corps de la PR automatisée doit rester aligné sur le gabarit de gouvernance.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
  push:
    branches: [main]
    paths:
      - "00-SYSTEME-MAD/governance/repos.json"
      - "08-BOOTSTRAPS/generate-governance-dashboard.mjs"
      - ".github/workflows/governance-dashboard.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read

concurrency:
  group: governance-dashboard
  cancel-in-progress: false

jobs:
  generate:
    name: Generate governance dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.MAD_GOVERNANCE_TOKEN || github.token }}
        run: node 08-BOOTSTRAPS/generate-governance-dashboard.mjs

      - name: Validate generated document
        run: |
          test -s 00-SYSTEME-MAD/governance/generated-dashboard.md
          grep -q "Projet: MADSuite" 00-SYSTEME-MAD/governance/generated-dashboard.md
          grep -q "Signal automatisé GitHub" 00-SYSTEME-MAD/governance/generated-dashboard.md

      - name: Create or update governance PR
        env:
          GH_TOKEN: ${{ secrets.MAD_GOVERNANCE_TOKEN || github.token }}
        run: |
          if git diff --quiet -- 00-SYSTEME-MAD/governance/generated-dashboard.md; then
            echo "Dashboard déjà à jour."
            exit 0
          fi

          branch="automation/governance-dashboard"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          cat > "$body_file" <<'EOF'
          ## Intention

          Actualiser automatiquement les signaux GitHub observables du tableau de bord de gouvernance, sans présenter cet instantané comme une validation humaine complète de la santé d’ingénierie.

          ## Changements principaux

          - mise à jour automatisée de `00-SYSTEME-MAD/governance/generated-dashboard.md`;
          - rafraîchissement des états CI, du nombre de pull requests ouvertes et des enjeux observables;
          - conservation de la distinction entre signal automatisé et Engineering Health Score complet;
          - aucune modification fonctionnelle de MADSuite ni des règles institutionnelles.

          ## Vérifications effectuées

          - modification limitée au tableau de bord généré;
          - branche autorisée `automation/governance-dashboard`;
          - auteur autorisé `github-actions[bot]`;
          - génération et validation du document exécutées par le workflow dédié;
          - aucune modification manuelle d’un autre document, d’un secret ou d’un code applicatif.

          ## Risques et points à surveiller

          - les données représentent un instantané et peuvent évoluer après la génération;
          - les dépôts inaccessibles ou les protections non lisibles demeurent non vérifiables;
          - une donnée automatisée peut nécessiter une interprétation humaine;
          - le Engineering Health Score complet ne doit pas être considéré comme validé par cette PR seule.

          ## Portée

          Cette PR actualise seulement le tableau de bord de gouvernance généré automatiquement.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add 00-SYSTEME-MAD/governance/generated-dashboard.md
          git commit -m "chore(governance): refresh generated dashboard"
          git push --force-with-lease origin "$branch"

          existing_pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "[AUTO] Actualiser le dashboard de gouvernance" \
              --body-file "$body_file"
          else
            gh pr edit "$existing_pr" \
              --title "[AUTO] Actualiser le dashboard de gouvernance" \
              --body-file "$body_file"
            echo "PR #$existing_pr déjà ouverte et description remise en conformité."
          fi
