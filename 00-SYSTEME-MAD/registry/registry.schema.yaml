$schema: "https://json-schema.org/draft/2020-12/schema"
title: MAD Registry Entry
description: Schéma d'une entrée du MAD Registry et de ses relations canoniques.
type: object
additionalProperties: false
required:
  - id
  - type
  - title
  - status
  - version
  - owner
  - path
  - created_at
  - updated_at
properties:
  id:
    type: string
    pattern: "^[A-Z]+-[0-9]{3,}$"
    description: Identifiant unique et immuable de l'objet.
  type:
    type: string
    pattern: "^[A-Z]+$"
    description: Type documentaire ou fonctionnel déclaré pour l'objet.
  title:
    type: string
    minLength: 1
  status:
    type: string
    enum:
      - Officiel
      - Accepté
      - Brouillon
      - À valider
      - À fusionner
      - Template
      - Archive
      - Déprécié
  version:
    type: string
    pattern: "^[0-9]+\.[0-9]+(?:\.[0-9]+)?$"
  owner:
    type: string
    minLength: 1
  path:
    type: string
    minLength: 1
    description: Chemin canonique relatif à la racine du dépôt.
  summary:
    type: string
  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  relations:
    type: array
    uniqueItems: true
    description: Relations sortantes de l'objet vers d'autres identifiants canoniques.
    items:
      type: object
      additionalProperties: false
      required:
        - type
        - target
      properties:
        type:
          type: string
          enum:
            - depend_de
            - met_en_oeuvre
            - valide
            - remplace
            - derive_de
            - associe_a
        target:
          type: string
          pattern: "^[A-Z]+-[0-9]{3,}$"
  created_at:
    type: string
    format: date
    description: Date de création initiale de l'objet dans le système.
  updated_at:
    type: string
    format: date
    description: Date de dernière modification connue de l'objet.
